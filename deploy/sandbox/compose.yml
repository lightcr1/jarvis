# Sandbox-Zone: Executor + eingeschraenkter Docker-Socket-Proxy (Plan 4.1/4.2).
#
# Standardmaessig NICHT aktiv. Scharfschalten (auf der Jarvis-VM):
#   JARVIS_EXECUTOR_ENABLED=1 JARVIS_AGENT_REQUEST_TOKEN=... \
#     docker compose -f deploy/sandbox/compose.yml up -d --build
#
# Der Executor ist die EINZIGE Stelle mit Laufzeit-Zugriff (ueber den Proxy).
# Der Proxy erlaubt nur Container-/Image-/Netz-/Exec-Operationen -- keine
# Volumes, kein Build, kein Swarm, keine Auth. Kritische Dienste schuetzt
# zusaetzlich die Zonen-Policy (config/zones.json).
name: jarvis-sandbox

services:
  docker-socket-proxy:
    # Digest-gepinnt (reproduzierbar); Override via JARVIS_SOCKET_PROXY_IMAGE.
    image: ${JARVIS_SOCKET_PROXY_IMAGE:-tecnativa/docker-socket-proxy@sha256:083bd0ed8783e366d745f332f0e4489816dd35d984bef8f16e6d89484a22c082}
    container_name: jarvis-docker-socket-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      IMAGES: 1
      NETWORKS: 1
      POST: 1
      DELETE: 1
      EXEC: 1
      BUILD: 0
      COMMIT: 0
      CONFIGS: 0
      DISTRIBUTION: 0
      INFO: 0
      NODES: 0
      PLUGINS: 0
      SERVICES: 0
      SESSION: 0
      SWARM: 0
      SYSTEM: 0
      TASKS: 0
      VERSION: 0
      VOLUMES: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - executor-internal
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 128

  jarvis-executor:
    build:
      context: ../..
      dockerfile: services/executor/Dockerfile
    image: ${JARVIS_EXECUTOR_IMAGE:-jarvis-executor:local}
    container_name: jarvis-executor
    restart: unless-stopped
    environment:
      JARVIS_EXECUTOR_ENABLED: ${JARVIS_EXECUTOR_ENABLED:-0}
      JARVIS_DOCKER_API: http://docker-socket-proxy:2375
      JARVIS_AGENT_REQUEST_TOKEN: ${JARVIS_AGENT_REQUEST_TOKEN:?JARVIS_AGENT_REQUEST_TOKEN must be set}
      JARVIS_HOST_CPUS: ${JARVIS_HOST_CPUS:-4}
      JARVIS_HOST_MEMORY_MB: ${JARVIS_HOST_MEMORY_MB:-16384}
      # Not-Aus (T0/T1/T2/T3 -> deny) und Aufraeum-Intervall:
      JARVIS_EMERGENCY_STOP: ${JARVIS_EMERGENCY_STOP:-0}
      JARVIS_EXECUTOR_REAP_SECONDS: ${JARVIS_EXECUTOR_REAP_SECONDS:-120}
      JARVIS_EXECUTOR_AUDIT_LOG: /var/lib/jarvis/executor-audit.log
      # Zentraler Not-Aus: dieselbe Datei wie in der App.
      JARVIS_EMERGENCY_STOP_FILE: /var/lib/jarvis/emergency/stop
    volumes:
      - executor-audit:/var/lib/jarvis
      - jarvis-emergency:/var/lib/jarvis/emergency
    networks:
      - executor-internal
      - sandbox
      - agent-isolated
      - runpod-internal
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,mode=1777
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 256

volumes:
  executor-audit:
  # Von der App definiert (name: jarvis-emergency); hier nur referenziert.
  jarvis-emergency:
    external: true
    name: jarvis-emergency

networks:
  executor-internal:
    internal: true
  # Internes Netz: KEIN direkter Internet-/LAN-Zugang. Egress nur ueber den
  # Allowlist-Proxy, der diesem Netz beitritt (siehe deploy/openhands/compose.yml).
  sandbox:
    name: jarvis-sandbox
    driver: bridge
    internal: true
  # Der Agent (openhands-Stack) erreicht den Executor nur ueber dieses Netz.
  # Externes Netz des openhands-Projekts -> dort zuerst starten.
  agent-isolated:
    external: true
    name: ${JARVIS_AGENT_NETWORK:-openhands_agent-isolated}
  # Gleiches Netz wie jarvis-app, damit der Chat-Backend den Executor erreicht.
  # Zugriff bleibt token-geschuetzt; kein Host-Port.
  runpod-internal:
    external: true
    name: ${RUNPOD_NETWORK_NAME:-runpod_default}
