server {
    listen 8080;
    server_tokens off;
    client_max_body_size 8m;

    # Thin edge: exposes ONLY the OpenHands canvas on host port 8001.
    # The agent itself stays on the internal isolated network with no port publish.
    location /health {
        proxy_pass http://jarvis-openhands:8000/health;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 5s;
    }
    location / {
        proxy_pass http://jarvis-openhands:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}
