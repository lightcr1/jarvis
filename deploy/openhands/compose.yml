services:
  agent-canvas:
    image: ${OPENHANDS_IMAGE:?Set OPENHANDS_IMAGE in .env}
    container_name: jarvis-openhands
    restart: unless-stopped
    ports:
      - "${OPENHANDS_BIND_IP:-127.0.0.1}:${OPENHANDS_PORT:-8000}:8000"
    volumes:
      - type: bind
        source: ${OPENHANDS_STATE_DIR:?Set OPENHANDS_STATE_DIR}
        target: /home/openhands/.openhands
      - type: bind
        source: ${OPENHANDS_PROJECTS_DIR:?Set OPENHANDS_PROJECTS_DIR}
        target: /projects
    networks:
      - default
      - runpod-internal
    security_opt:
      - no-new-privileges:true
    extra_hosts:
      - host.docker.internal:host-gateway

networks:
  runpod-internal:
    external: true
    name: ${RUNPOD_NETWORK_NAME:-runpod_default}
