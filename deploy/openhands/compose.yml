services:
  agent-canvas:
    image: ${OPENHANDS_IMAGE:?Set OPENHANDS_IMAGE in .env}
    container_name: jarvis-openhands
    restart: unless-stopped
    # No host port publish: the agent stays on the internal network.
    # The canvas is exposed via canvas-edge (host port OPENHANDS_EDGE_PORT).
    environment:
      # Request-only capability: cannot approve actions or reveal server-side service tokens.
      JARVIS_AGENT_REQUEST_TOKEN: ${JARVIS_AGENT_REQUEST_TOKEN:?Set JARVIS_AGENT_REQUEST_TOKEN}
      # Kontrollierter Ausgang ins Internet ueber den Allowlist-Proxy.
      # Nur pypi.org, files.pythonhosted.org, github.com & Download-Hosts.
      HTTP_PROXY: ${PROXY_URL:-http://allowlist-proxy:3128}
      HTTPS_PROXY: ${PROXY_URL:-http://allowlist-proxy:3128}
      # Interne Dienste und lokale Pfade niemals ueber den Proxy.
      NO_PROXY: ${NO_PROXY:-inference-gateway,canvas-edge,controller,openhands,127.0.0.1,localhost,::1}
    volumes:
      - type: bind
        source: ${OPENHANDS_STATE_DIR:?Set OPENHANDS_STATE_DIR}
        target: /home/openhands/.openhands
      # Mount only the reviewed Jarvis clone, never the parent containing other projects.
      - type: bind
        source: ${OPENHANDS_JARVIS_PROJECT_DIR:?Set OPENHANDS_JARVIS_PROJECT_DIR}
        target: /projects/jarvis
    networks:
      - agent-isolated
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 512
    mem_limit: ${OPENHANDS_MEMORY_LIMIT:-8g}
    cpus: ${OPENHANDS_CPU_LIMIT:-4}

  canvas-edge:
    # Published nginx that only proxies the OpenHands canvas to the agent on
    # the internal network. Needed because internal networks do not publish
    # host ports on this daemon, and host port 8000 is used by jarvis.service.
    image: nginx:alpine@sha256:62ff2089abf5a9ed33bd232895bef5e22f7bb4b200675cec49a5ebc48e3d4ac8
    restart: unless-stopped
    user: "101:101"
    ports:
      - "0.0.0.0:${OPENHANDS_EDGE_PORT:-8001}:8080"
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=8m,noexec,nosuid,mode=1777
      - /var/run:size=1m,noexec,nosuid,mode=1777
    volumes:
      - ./canvas-edge.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - agent-isolated
      - runpod-internal
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  inference-gateway:
    image: nginx:alpine@sha256:62ff2089abf5a9ed33bd232895bef5e22f7bb4b200675cec49a5ebc48e3d4ac8
    restart: unless-stopped
    user: "101:101"
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=8m,noexec,nosuid,mode=1777
      - /var/run:size=1m,noexec,nosuid,mode=1777
    volumes:
      - ./inference-gateway.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - agent-isolated
      - runpod-internal
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  allowlist-proxy:
    # Strikt auf die Allowlist beschraenkter HTTP(S)-Proxy fuer den Agenten.
    # Dual-homed: intern erreichbar (agent-isolated), Internet nur ueber
    # runpod-internal. Ohne eigene Registry-Anbindung wird das Image lokal
    # gebaut (klein, python:3.12-alpine).
    build:
      context: ./allowlist-proxy
    image: ${ALLOWLIST_PROXY_IMAGE:-allowlist-proxy:local}
    restart: unless-stopped
    environment:
      # Quell-IP fuer ausgehende Verbindungen (runpod_default-IP). Leer:
      # der Proxy erkennt die Egress-IP zur Laufzeit automatisch.
      EGRESS_IP: ${EGRESS_IP:-}
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,mode=1777
    networks:
      - agent-isolated
      - runpod-internal
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1',3128),2); s.close()"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  agent-isolated:
    internal: true
  runpod-internal:
    external: true
    name: ${RUNPOD_NETWORK_NAME:-runpod_default}
