server {
    listen 8080;
    server_tokens off;
    client_max_body_size 2m;

    # Exact inference prefix only. No generic CONNECT or arbitrary upstream.
    location = /health {
        default_type application/json;
        return 200 '{"ok":true}';
    }
    location /agent/v1/ {
        proxy_pass http://controller:8080/agent/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host controller;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
        proxy_hide_header Server;
    }
    # Only typed request/status/execute endpoints. No admin, chat, arbitrary URL or generic proxy.
    location ~ "^/jarvis-agent/(grants/requests(?:/[a-f0-9]{32})?|research/search|projects(?:/[a-f0-9]{32})?|ideas(?:/[a-f0-9]{32})?|tasks(?:/next|/[a-f0-9]{32}(?:/(?:report|claim))?)?|repositories/[A-Za-z0-9-]+/[A-Za-z0-9_.-]+/(?:metadata|branches|files|patches)|actions/(?:github-pull-request|email-send|[a-f0-9]{32}/execute))$" {
        rewrite ^/jarvis-agent/(.*)$ /agent/$1 break;
        proxy_pass http://10.10.40.100:8100;
        proxy_http_version 1.1;
        proxy_set_header Host 10.10.40.100;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
    location / { return 403; }
}
