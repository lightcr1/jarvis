server {
    listen 8080;
    server_tokens off;
    client_max_body_size 2m;

    # Exact inference prefix only. No generic CONNECT or arbitrary upstream.
    location = /health {
        default_type application/json;
        return 200 '{"ok":true}';
    }
    location /agent/v1/ {
        proxy_pass http://controller:8080/agent/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host controller;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
        proxy_hide_header Server;
    }
    location / { return 403; }
}
