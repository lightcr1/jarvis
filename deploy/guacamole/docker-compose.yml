# Apache Guacamole stack for the JARVIS "Personal Cloud Workspace" feature.
#
# NOT started/run as part of this change — this file is handed off for the
# operator to review and run manually. Nothing here has been executed.
#
# What this brings up:
#   - guacd        the core Guacamole proxy daemon that speaks RDP/VNC to your
#                   Tailscale-reachable PCs on guacd's behalf
#   - postgres      Guacamole's own config database (its user accounts, saved
#                   connections, connection history — NOT related to JARVIS's
#                   own stores). Guacamole does not auto-create its schema; see
#                   "One-time setup" below.
#   - guacamole     the guacamole-client webapp (browser RDP/VNC viewer + REST
#                   API JARVIS's backend calls indirectly via the signed
#                   `data` token produced by jarvis/workspace/guac_auth.py)
#
# How JARVIS fits in:
#   JARVIS never talks to guacd or Postgres directly. It signs a short-lived
#   JSON payload (target hostname/port/protocol/credentials) using the shared
#   secret below, and hands the browser a URL like
#   `<JARVIS_WORKSPACE_GUACAMOLE_URL>/?data=<token>` — the guacamole-client
#   webapp itself validates and decrypts that token via the auth-json
#   extension (JSON_SECRET_KEY, same value as JARVIS_WORKSPACE_JSON_SECRET)
#   and logs the browser straight into a single ephemeral connection. No
#   Guacamole user account is created or needed for that path — the Postgres
#   database above is only for YOUR OWN admin login to Guacamole's UI, if you
#   want one (e.g. to inspect connection history).
#
# One-time setup before `docker compose up -d`:
#   1. Create a `.env` file next to this compose file (NOT committed) with:
#        GUACAMOLE_VERSION=1.5.5
#        GUACAMOLE_DB_PASSWORD=<random password>
#        GUACAMOLE_JSON_SECRET=<32 hex chars / 16 bytes — this MUST be the
#          exact same value you set for JARVIS_WORKSPACE_JSON_SECRET on the
#          JARVIS server. Generate one with:
#            python3 -c "import secrets; print(secrets.token_hex(16))"
#   2. Download the `guacamole-auth-json` extension matching GUACAMOLE_VERSION
#      from https://guacamole.apache.org/releases/ (look under the matching
#      version's "extensions" listing for guacamole-auth-json-<version>.tar.gz),
#      extract it, and copy the .jar file into ./extensions/ next to this
#      file. Some recent Guacamole images may already bundle this extension —
#      check /etc/guacamole/extensions inside a running `guacamole` container
#      before assuming you need this step, but including the jar is harmless
#      if versions match.
#   3. Generate the Postgres schema once, before first start:
#        docker run --rm guacamole/guacamole:${GUACAMOLE_VERSION:-1.5.5} \
#          /opt/guacamole/bin/initdb.sh --postgresql > ./init/initdb.sql
#      (create the ./init/ directory first — it's mounted read-only into the
#      postgres container's docker-entrypoint-initdb.d/ so it only runs once,
#      on first container start with an empty data volume.)
#   4. `docker compose up -d`, then visit http://<this-host>:8081/guacamole/
#      once to confirm guacd + postgres + the webapp are talking to each
#      other (default admin login is guacadmin/guacadmin — change it
#      immediately, or skip this entirely since JARVIS's json-auth path
#      doesn't need it).
#   5. Set JARVIS_WORKSPACE_GUACAMOLE_URL=http://<this-host>:8081/guacamole
#      and JARVIS_WORKSPACE_JSON_SECRET=<same value as GUACAMOLE_JSON_SECRET
#      above> on the JARVIS server and restart it.
#
# This stack is intentionally NOT put behind JARVIS's own auth — put it
# behind your own reverse proxy / Tailscale ACLs / Cloudflare Tunnel the same
# way the rest of your homelab is exposed. The `data` token is short-lived
# (issued with a small `expires` window) but the base Guacamole webapp URL
# itself should still not be open to the public internet unauthenticated.

services:
  guacd:
    image: guacamole/guacd:${GUACAMOLE_VERSION:-1.5.5}
    restart: unless-stopped
    volumes:
      - guacd-drive:/drive
      - guacd-record:/record

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: guacamole_db
      POSTGRES_USER: guacamole_user
      # Set in .env — see "One-time setup" step 1 above.
      POSTGRES_PASSWORD: ${GUACAMOLE_DB_PASSWORD:?set GUACAMOLE_DB_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Generated once via `initdb.sh` — see "One-time setup" step 3 above.
      - ./init:/docker-entrypoint-initdb.d:ro

  guacamole:
    image: guacamole/guacamole:${GUACAMOLE_VERSION:-1.5.5}
    restart: unless-stopped
    depends_on:
      - guacd
      - postgres
    environment:
      GUACD_HOSTNAME: guacd
      GUACD_PORT: "4822"
      POSTGRES_HOSTNAME: postgres
      POSTGRES_DATABASE: guacamole_db
      POSTGRES_USER: guacamole_user
      POSTGRES_PASSWORD: ${GUACAMOLE_DB_PASSWORD:?set GUACAMOLE_DB_PASSWORD in .env}
      # Must exactly match JARVIS_WORKSPACE_JSON_SECRET on the JARVIS server.
      # 32 hex chars (16 bytes / 128-bit AES key) — see "One-time setup" step 1.
      JSON_SECRET_KEY: ${GUACAMOLE_JSON_SECRET:?set GUACAMOLE_JSON_SECRET in .env}
      # Any Guacamole config property can be set this way: uppercase the
      # guacamole.properties key and replace dashes with underscores.
      # JSON_TRUSTED_NETWORKS: "100.64.0.0/10"   # uncomment to also restrict
      #   by source IP (Tailscale's CGNAT range) in addition to the signed
      #   token itself, if guacamole-client can see the real client IP.
    ports:
      # Host port 8081 chosen to avoid clashing with JARVIS's own :8000 and
      # any existing services (nginx, etc.) — change as needed for your host.
      - "8081:8080"
    volumes:
      # Extension jar(s) — see "One-time setup" step 2 above.
      - ./extensions:/etc/guacamole/extensions:ro

volumes:
  guacd-drive:
  guacd-record:
  postgres-data:
